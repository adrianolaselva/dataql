name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: go build -v ./...

      - name: Build Binary
        run: go build -o dataql ./main.go

      - name: Verify Commands
        run: |
          echo "Verifying all CLI commands are registered..."
          ./dataql --version
          ./dataql run --help > /dev/null && echo "✓ run command OK"
          ./dataql skills --help > /dev/null && echo "✓ skills command OK"
          ./dataql mcp --help > /dev/null && echo "✓ mcp command OK"
          ./dataql mcp serve --help > /dev/null && echo "✓ mcp serve command OK"
          ./dataql skills install --help > /dev/null && echo "✓ skills install command OK"
          ./dataql skills list --help > /dev/null && echo "✓ skills list command OK"
          echo "All commands verified!"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Coverage ratchet (never regress)
        run: COVERAGE_FILE=coverage.out scripts/coverage-ratchet.sh check

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  offline-smoke:
    name: Offline self-sufficiency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # Build with network available (module download), then prove the binary
      # works with the network fully disabled — no runtime downloads, no
      # external services. This guards the self-contained invariant.
      - name: Build binary
        run: go build -o dataql ./main.go

      - name: Smoke with network disabled
        run: sudo unshare -n scripts/smoke-offline.sh ./dataql

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  gosec:
    name: Security scan (advisory)
    runs-on: ubuntu-latest
    # Advisory only for now: gosec findings are being triaged and hardened in a
    # focused phase (see openspec change quality-harness-and-modernization).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest ./...
