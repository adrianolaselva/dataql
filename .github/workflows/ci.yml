name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build
        run: go build -v ./...

      - name: Build Binary
        run: go build -o dataql ./main.go

      - name: Verify Commands
        run: |
          echo "Verifying all CLI commands are registered..."
          ./dataql --version
          ./dataql run --help > /dev/null && echo "✓ run command OK"
          ./dataql skills --help > /dev/null && echo "✓ skills command OK"
          ./dataql mcp --help > /dev/null && echo "✓ mcp command OK"
          ./dataql mcp serve --help > /dev/null && echo "✓ mcp serve command OK"
          ./dataql skills install --help > /dev/null && echo "✓ skills install command OK"
          ./dataql skills list --help > /dev/null && echo "✓ skills list command OK"
          echo "All commands verified!"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Coverage ratchet (never regress)
        run: COVERAGE_FILE=coverage.out scripts/coverage-ratchet.sh check

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  offline-smoke:
    name: Offline self-sufficiency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      # Build with network available (module download), then prove the binary
      # works with the network fully disabled — no runtime downloads, no
      # external services. This guards the self-contained invariant.
      - name: Build binary
        run: go build -o dataql ./main.go

      - name: Smoke with network disabled
        run: sudo unshare -n scripts/smoke-offline.sh ./dataql

  selfcontained-build:
    name: Self-contained release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      # Build with the same flags the release uses: DuckDB engine embedded
      # (no noduckdb stub), glibc dynamic, C++/gcc runtimes static. Then prove
      # the release-style binary is self-contained by running the smoke with the
      # network disabled.
      - name: Build release-style binary (DuckDB embedded)
        run: >
          CGO_ENABLED=1 go build
          -ldflags '-s -w -linkmode external -extldflags "-static-libgcc -static-libstdc++"'
          -o dataql-release ./main.go

      - name: Offline smoke against release binary
        run: sudo unshare -n scripts/smoke-offline.sh ./dataql-release

  docker:
    name: Docker image (self-contained)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dataql:ci --build-arg VERSION=ci .

      - name: Offline query through the image
        run: |
          docker run --rm --network none -v "$PWD/tests/fixtures/csv":/data \
            dataql:ci run -Q -f /data/customers.csv -q "SELECT COUNT(*) AS n FROM customers"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Must be built with Go >= the go.mod toolchain (1.26); older
          # prebuilt binaries refuse to load a newer module.
          version: v2.12.2

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  gosec:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: gosec
        run: scripts/gosec.sh

  e2e:
    name: E2E (advisory)
    runs-on: ubuntu-latest
    # Advisory until the coverage gaps in e2e/COVERAGE.md close and the suite is
    # stable in CI; then this becomes a blocking gate (task 5.3).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run E2E suite
        run: make e2e
