name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    # Build natively on glibc (not Alpine/musl) so the DuckDB engine is embedded
    # in the released binary. ubuntu-latest ships gcc/g++ for CGO.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Publish Docker image (GHCR)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The self-contained image (DuckDB embedded). amd64 today; arm64 is a
      # tracked follow-up (needs the zig cross toolchain in the build).
      - name: Build and push
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          docker build -t "$IMAGE:${VERSION}" -t "$IMAGE:latest" \
            --build-arg VERSION="${VERSION}" --build-arg COMMIT="${{ github.sha }}" .
          docker push "$IMAGE:${VERSION}"
          docker push "$IMAGE:latest"
